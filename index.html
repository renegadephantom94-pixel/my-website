<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results Summary Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <section class="result">
      <h2 class="result__title">Your Result</h2>
      <div class="result__score">
        <span class="result__number">76</span>
        <span class="result__total">of 100</span>
      </div>
      <h1 class="result__rating">Great</h1>
      <p class="result__text">You scored higher than 65% of the people who have taken these tests.</p>
    </section>

    <section class="summary">
      <h2 class="summary__title">Summary</h2>
      <ul class="summary__list">
        <li class="item item--reaction">
          <svg class="item__icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true">
            <path d="M10.5 2 4 11h5l-1 7 7-9.5h-5L10.5 2Z"/>
          </svg>
          <span class="item__name">Reaction</span>
          <span class="item__score"><strong>80</strong> / 100</span>
        </li>
        <li class="item item--memory">
          <svg class="item__icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="10" cy="10" r="8.4"/>
            <path d="M10 1.8v16.4M10 7c-2 0-3.5-.8-4.5-2M10 12c-2 0-3.5.8-4.5 2M10 7c2 0 3.5-.8 4.5-2M10 12c2 0 3.5.8 4.5 2M3 10h4M13 10h4"/>
          </svg>
          <span class="item__name">Memory</span>
          <span class="item__score"><strong>92</strong> / 100</span>
        </li>
        <li class="item item--verbal">
          <svg class="item__icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 2a8 8 0 1 1-3.9 15L2.5 18l1-3.4A8 8 0 0 1 10 2Z"/>
            <path d="M8 10h4"/>
          </svg>
          <span class="item__name">Verbal</span>
          <span class="item__score"><strong>61</strong> / 100</span>
        </li>
        <li class="item item--visual">
          <svg class="item__icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1.5 10S5 4.5 10 4.5 18.5 10 18.5 10 15 15.5 10 15.5 1.5 10 1.5 10Z"/>
            <circle cx="10" cy="10" r="1.8"/>
          </svg>
          <span class="item__name">Visual</span>
          <span class="item__score"><strong>73</strong> / 100</span>
        </li>
      </ul>
      <button class="btn" type="button">Continue</button>
    </section>
  </main>
</body>
</html>
